<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Poissonnerie de l'Est — Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d3e">
<meta name="description" content="Dashboard admin — Poissonnerie de l'Est">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Poissonnerie Est">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#0a3050; --pine2:#15619a; --pine3:#eaf3f7;
  --sand:#f7f0e1; --paper:#fffdf9; --ink:#0f2436; --muted:#69727c; --line:#e6d6b3;
  --gold:#c8963a; --gold2:#f6e2b3; --gold-dp:#9c7226; --sun:#e56f2e; --wave:#0d6fa3;
  --ok:#1f7a4d; --okbg:#e2f3ea; --warn:#b8690f; --warnbg:#fbeed8; --bad:#b3372e; --badbg:#fae3e0; --info:#245b8f; --infobg:#e2edf8;
  --nav-h:68px; --top-h:58px;
  --r:16px; --rs:11px;
  --disp:'Fraunces',Georgia,'Times New Roman',serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --sh-sm:0 2px 8px rgba(12,40,64,.07);
  --sh-md:0 10px 26px rgba(12,40,64,.10);
  --sh-lg:0 20px 46px rgba(6,27,48,.20);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);
  background:
    radial-gradient(1100px 480px at 85% -140px,rgba(229,111,46,.22),transparent 60%),
    linear-gradient(180deg,#061b30 0,#0e3455 128px,var(--sand) 129px,var(--sand) 100%);
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
body.noscroll{overflow:hidden}
h1,h2,h3{margin:0;line-height:1.18;font-family:var(--disp);font-weight:600;letter-spacing:.1px}
h1{font-size:24px} h2{font-size:18px} h3{font-size:15px;font-family:inherit;font-weight:700}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

/* ---------- Barre du haut ---------- */
.top{position:sticky;top:0;z-index:20;color:#fff;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 11px;min-height:calc(var(--top-h) + env(safe-area-inset-top));
  background:linear-gradient(135deg,#051627 0%,#082c4c 45%,#0f4b78 88%,#155f8f 100%);box-shadow:0 10px 28px rgba(4,18,32,.28);overflow:hidden}
.top::before{content:"";position:absolute;left:-8%;right:-8%;bottom:-64%;height:120%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(229,111,46,.30),transparent 70%);opacity:.65}
.top::after{content:"";position:absolute;inset:0;pointer-events:none;background:url("logo.png") no-repeat right -30px center/148px auto;opacity:.13;mix-blend-mode:soft-light}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1;position:relative;z-index:1}
.mark{flex:0 0 auto;width:52px;height:52px;border-radius:50%;background:linear-gradient(150deg,var(--gold-lt,#e9c064),var(--gold) 62%,var(--gold-dp));color:var(--pine);display:grid;place-items:center;font-weight:800;letter-spacing:.5px;font-size:14px;box-shadow:0 0 0 3px rgba(255,255,255,.2),0 6px 16px rgba(0,0,0,.28)}
.logo{flex:0 0 auto;width:60px;height:60px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.24),0 8px 20px rgba(0,0,0,.3);animation:pop .3s var(--ease)}
.brand-txt{min-width:0;line-height:1.15}
.brand-txt b{display:block;font-family:var(--disp);font-weight:600;font-size:17px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt span{font-size:12px;opacity:.88;letter-spacing:.3px;color:#f3d79c}
.pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:0;border-radius:99px;padding:8px 12px;font-size:13px;font-weight:600;min-height:36px;cursor:pointer;transition:transform .15s var(--ease);position:relative;z-index:1}
.pill:active{transform:scale(.96)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;display:block;box-shadow:0 0 0 3px currentColor;opacity:.9}
.pill.on{background:var(--okbg);color:var(--ok)} .pill.off{background:var(--badbg);color:var(--bad)}
.pill.wait{background:var(--warnbg);color:var(--warn)} .pill.sync{background:var(--infobg);color:var(--info)}
.pill.sync i{animation:pulse 1s infinite}
.sync-now{position:relative;z-index:1;min-width:44px;border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.12);backdrop-filter:blur(6px);color:#fff;transition:background .15s var(--ease),transform .15s var(--ease)}
.sync-now:active{transform:scale(.94);background:rgba(255,255,255,.22)}
.sync-now svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sync-now span{display:none}
@media (min-width:760px){.sync-now{padding:0 16px}.sync-now span{display:inline}}
@keyframes pulse{50%{opacity:.25}}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Navigation basse ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,253,249,.92);backdrop-filter:blur(14px) saturate(1.2);border-top:1px solid var(--line);
  display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -6px 22px rgba(15,45,61,.09)}
#nav::-webkit-scrollbar{display:none}
#nav a{flex:0 0 max(76px,21.6vw);height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:11.5px;font-weight:600;color:var(--muted);position:relative;transition:color .18s var(--ease)}
#nav a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s var(--ease)}
#nav a:active svg{transform:scale(.88)}
#nav a.on{color:var(--pine)}
#nav a.on svg{transform:translateY(-1px)}
#nav a.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--gold),var(--sun))}
#nav a .dot{position:absolute;top:8px;right:calc(50% - 21px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--warn);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;box-shadow:0 0 0 2px var(--paper)}

main{padding:16px 14px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);max-width:1100px;margin:0 auto}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 14px;animation:fadeUp .32s var(--ease)}
.page-h .sub{color:var(--muted);font-size:13px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--pine2);font-weight:600;padding:8px 0;min-height:44px;transition:gap .15s var(--ease)}
.back:active{gap:9px}

/* ---------- Composants ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--rs);border:1px solid var(--line);background:var(--paper);font-weight:650;cursor:pointer;box-shadow:var(--sh-sm);transition:transform .14s var(--ease),box-shadow .14s var(--ease),background .14s var(--ease)}
.btn:active{transform:scale(.97);box-shadow:0 1px 3px rgba(12,40,64,.08)}
.btn.primary{background:linear-gradient(135deg,var(--pine),var(--pine2));border-color:var(--pine);color:#fff;box-shadow:0 8px 20px rgba(10,48,80,.28)}
.btn.gold{background:linear-gradient(135deg,#dba94b,var(--gold));border-color:var(--gold-dp);color:#fff;box-shadow:0 8px 20px rgba(156,114,38,.28)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.danger{color:var(--bad);border-color:#e7bcb7;box-shadow:none}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none;box-shadow:none}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.search input{width:100%;height:50px;border-radius:var(--rs);border:1px solid var(--line);background:var(--paper);padding:0 14px 0 44px;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.search input:focus{outline:none;border-color:var(--pine2);box-shadow:0 0 0 3px rgba(21,97,154,.14)}
.chips{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:8px 16px;min-height:40px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .16s var(--ease)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--pine);border-color:var(--pine);color:#fff;box-shadow:0 4px 12px rgba(10,48,80,.24)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.toolbar .search{flex:1;margin:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;box-shadow:var(--sh-sm);animation:fadeUp .32s var(--ease) backwards}
.tile small{display:block;color:var(--muted);font-size:12.5px;font-weight:600;margin-bottom:6px}
.tile b{display:block;font-family:var(--disp);font-weight:600;font-size:22px;line-height:1.12;overflow-wrap:anywhere}
.tile.hl{background:linear-gradient(135deg,#071f37,#0f4972);border-color:#174f77;color:#fff;box-shadow:var(--sh-md)}
.tile.hl small{color:#b9d3d0}
.tile.neg b{color:var(--bad)} .tile.pos b{color:var(--ok)}
.tile.hl.neg b{color:#ffb4ab}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick .btn{min-height:66px;flex-direction:column;gap:5px;font-size:14.5px}
h2.sec{margin:24px 0 10px}
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:block;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--sh-sm);transition:transform .14s var(--ease),box-shadow .14s var(--ease);animation:fadeUp .3s var(--ease) backwards}
.cards .card:nth-child(1){animation-delay:0ms} .cards .card:nth-child(2){animation-delay:25ms} .cards .card:nth-child(3){animation-delay:50ms}
.cards .card:nth-child(4){animation-delay:75ms} .cards .card:nth-child(5){animation-delay:100ms} .cards .card:nth-child(n+6){animation-delay:120ms}
a.card:active{transform:scale(.985);background:#fbf6ea}
.card .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card .row+.row{margin-top:4px}
.card .sub{color:var(--muted);font-size:13.5px}
.card b{font-weight:700}
.amt{font-weight:750;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:650;vertical-align:middle}
.badge.wait{background:var(--warnbg);color:var(--warn)} .badge.ok{background:var(--okbg);color:var(--ok)}
.badge.bad{background:var(--badbg);color:var(--bad)} .badge.info{background:var(--infobg);color:var(--info)}
.badge.gray{background:#ece8dc;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 16px;background:var(--paper);border:1px dashed var(--line);border-radius:var(--r)}
@media (hover:hover){
  .btn:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
  .card:hover,a.card:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}
  .tile:hover{box-shadow:var(--sh-md)}
  #nav a:hover{color:var(--pine)}
}
.banner{background:linear-gradient(135deg,var(--gold2),#f9ecc6);border:1px solid #e6d19b;border-radius:var(--r);padding:12px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:var(--sh-sm)}
.banner.bad{background:var(--badbg);border-color:#efc2bd}
.more{width:100%;margin-top:10px}
.tbl-wrap{display:none}
.tbl{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-sm)}
.tbl th{background:linear-gradient(135deg,#0a2f4d,#124d78);color:#fff;text-align:left;font-size:12.5px;padding:11px 12px;letter-spacing:.3px}
.tbl td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr.clk{cursor:pointer;transition:background .12s var(--ease)} .tbl tr.clk:hover td{background:#fbf6ea}
.tbl .r{text-align:right} .tbl .nowrap{white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0} .kv span{color:var(--muted)} .kv b{text-align:right}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh-sm)}
.panel h3{margin-bottom:8px}
.hint{color:var(--muted);font-size:13.5px}
.mono{font-variant-numeric:tabular-nums}
.res{margin-top:10px;font-size:14px;font-weight:600}
.res.ok{color:var(--ok)} .res.bad{color:var(--bad)}
.opl{display:flex;flex-direction:column;gap:8px}
.op{border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px;background:#fff;box-shadow:var(--sh-sm)}
.op.failed{border-color:#efc2bd;background:#fff7f6}
.op .acts{display:flex;gap:8px;margin-top:8px}
.op .acts .btn{min-height:40px;padding:0 14px}

/* ---------- Formulaires (feuille du bas) ---------- */
.ov{position:fixed;inset:0;background:rgba(7,22,35,.52);backdrop-filter:blur(2px);z-index:50;animation:ovIn .18s var(--ease)}
@keyframes ovIn{from{opacity:0}}
.sheet{position:fixed;z-index:51;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;background:var(--paper);border-radius:22px 22px 0 0;
  padding:22px 16px calc(16px + env(safe-area-inset-bottom));animation:up .26s var(--ease);box-shadow:0 -12px 40px rgba(6,20,34,.28)}
.sheet::before{content:"";position:sticky;top:-22px;display:block;width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(36px);opacity:0}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-h h2{font-family:var(--disp)}
.x{border:0;background:#efe9da;width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer;transition:background .15s var(--ease),transform .15s var(--ease)}
.x:active{transform:scale(.9);background:#e6dfc9}
label.f{display:block;margin-bottom:14px;font-weight:600;font-size:14px}
label.f>span.l{display:block;margin-bottom:5px;color:var(--muted);font-size:13px}
.in{width:100%;height:50px;border:1px solid #cfc6ae;border-radius:var(--rs);background:#fff;padding:0 14px;font-size:16px;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.in:focus{outline:none;border-color:var(--gold-dp);box-shadow:0 0 0 3px rgba(200,150,58,.2)}
.in[readonly]{background:#f3efe3;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.seg label{display:block;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;height:50px;border:1px solid #cfc6ae;border-radius:var(--rs);font-weight:650;background:#fff;transition:all .16s var(--ease)}
.seg input:checked+span{background:linear-gradient(135deg,var(--pine),var(--pine2));border-color:var(--pine);color:#fff;box-shadow:0 6px 16px rgba(10,48,80,.26)}
.calc{background:var(--pine3);border-radius:var(--rs);padding:13px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;border:1px solid #d7e6ec}
.calc b{font-family:var(--disp);font-size:21px;color:var(--pine)}
.err{color:var(--bad);font-weight:600;font-size:14px;min-height:0;margin-bottom:8px}
.sheet-f{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;position:sticky;bottom:0;background:var(--paper);padding-top:10px}
.toolbar .btn{padding:0 16px;flex:0 0 auto}
@media (max-width:480px){.hide-s{display:none}.toolbar .btn{width:50px;padding:0}}

/* ---------- Reçu ---------- */
.receipt{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px 20px;max-width:560px;margin:0 auto 14px;position:relative;overflow:hidden;box-shadow:var(--sh-lg);animation:fadeUp .32s var(--ease)}
.receipt::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,var(--pine),var(--wave),var(--gold),var(--sun))}
.receipt::after{content:"";position:absolute;inset:52px 18px 18px;background:url("logo.png") no-repeat center/68% auto;opacity:.07;pointer-events:none}
.receipt>*{position:relative;z-index:1}
.receipt .rh{text-align:center;padding-top:10px;margin-bottom:14px}
.receipt .rh img{width:96px;height:96px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 10px;box-shadow:0 0 0 4px #f8eed8,var(--sh-sm)}
.receipt .rh b{display:block;font-family:var(--disp);letter-spacing:.3px;font-size:18px;color:var(--pine)}
.receipt .rh span{color:var(--muted);font-size:13px}
.receipt .big{text-align:center;margin:16px 0;font-family:var(--disp);font-size:32px;font-weight:700;color:var(--pine)}
.actions{display:flex;gap:10px;flex-wrap:wrap;max-width:520px;margin:0 auto}
.actions .btn{flex:1 1 140px}

#toast{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;background:#12292a;color:#fff;border-radius:var(--rs);padding:12px 16px;font-size:14.5px;font-weight:600;max-width:520px;box-shadow:0 10px 28px rgba(0,0,0,.28);animation:up .22s var(--ease)}
.toast.bad{background:var(--bad)} .toast.ok{background:var(--ok)}

/* ---------- Bureau ---------- */
@media (min-width:900px){
  body{padding-left:224px}
  #nav{z-index:15;top:0;right:auto;bottom:0;width:224px;flex-direction:column;overflow:visible;border-top:0;border-right:1px solid var(--line);
    padding:calc(var(--top-h) + env(safe-area-inset-top) + 16px) 12px 14px;box-shadow:none;backdrop-filter:none;background:var(--paper)}
  #nav a{flex:0 0 auto;height:48px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;border-radius:var(--rs);font-size:14.5px}
  #nav a.on{background:var(--pine3);color:var(--pine)} #nav a.on::before{display:none}
  #nav a.on svg{transform:none}
  #nav a .dot{position:static;margin-left:auto}
  .top{margin-left:-224px;padding-left:18px}
  main{padding-bottom:40px;padding-top:22px}
  .grid{grid-template-columns:repeat(4,1fr)} .quick{grid-template-columns:repeat(4,1fr)}
  .cards{display:none} .tbl-wrap{display:block}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:480px;border-radius:20px;animation:sheetPop .2s var(--ease)}
  .sheet::before{display:none}
  @keyframes sheetPop{from{transform:translate(-50%,-50%) scale(.96);opacity:0}}
  #toast{bottom:20px;left:224px}
}
@media print{
  body{background:#fff;padding:0}
  .top,#nav,#toast,.no-print,.back{display:none!important}
  main{padding:0;max-width:none}
  .receipt{border:1px solid #999;box-shadow:none;margin:0 auto}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark" id="mark">PE</span>
    <div class="brand-txt"><b>POISSONNERIE DE L'EST</b><span>Dashboard admin</span></div>
  </div>

<script>
'use strict';

   ===================================================================== */

// Lien de synchronisation par défaut.
// Peut rester vide : le lien se règle alors dans Paramètres.
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbz8UUV3W_MPOHDPKnplotVXoTpCgfVNjGK8ZixYtuSkqpaf3n2zPQmHrko_1pk-LOmxjw/exec';
const APP_VERSION = '1.1.1';
const LOGO_SRC = 'logo.png';
const DEFAULT_TARIFFS = { kg: 0.05, colis: 5 };
const METHODS = ['Espèces', 'Mobile money', 'Banque'];
const CATEGORIES = ['Transport', 'Salaire', 'Loyer', 'Électricité', 'Emballage', 'Entretien', 'Communication', 'Autre'];
const LS = { cache: 'pe.cache.v1', queue: 'pe.queue.v1', api: 'pe.api.v1' };
let LOGO_DATA_URL = '';

/* ---------- Utilitaires ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const round2 = n => Math.round((Number(n) + 1e-9) * 100) / 100;
const sum = (arr, f) => arr.reduce((s, x) => s + (Number(f(x)) || 0), 0);
const nfMoney = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nfQty = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 });
const nfTariff = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 6 });
const money = n => nfMoney.format(round2(n)) + ' $';
const qty = n => nfQty.format(Number(n) || 0);
const tariffTxt = n => nfTariff.format(Number(n) || 0);
const fmtDate = d => (/^\d{4}-\d{2}-\d{2}/.test(d || '') ? d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4) : d || '');
const fmtDateTime = ms => new Date(ms).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const uid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '').slice(0, 16) : Math.random().toString(36).slice(2, 10) + Date.now().toString(36));
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const matches = (q, hay) => { const h = norm(hay); return norm(q).split(/\s+/).filter(Boolean).every(t => h.includes(t)); };
const parseNum = s => { const t = String(s ?? '').trim().replace(/\s/g, '').replace(',', '.'); return t === '' ? NaN : Number(t); };
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(Date.parse(s));
const amountHay = n => [String(n), Number(n).toFixed(2), Number(n).toFixed(2).replace('.', ',')].join(' ');
const byDateDesc = (a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || '').localeCompare(a.createdAt || '') || String(b.entryId || b.paymentId || b.expenseId || b.receiptId || '').localeCompare(String(a.entryId || a.paymentId || a.expenseId || a.receiptId || ''));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };

const ICONS = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  suppliers: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16 4.6a3.5 3.5 0 010 6.8"/><path d="M18 14.6c2 .7 3.5 2.6 3.5 5.4"/>',
  entries: '<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  payments: '<rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19M6 15h4"/>',
  expenses: '<path d="M3 7h16a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M3 7l12-3v3M16.5 14h2"/>',
  tariffs: '<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.3"/>',
  receipts: '<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M8 8h8M8 12h8"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.5-4.5"/>'
};
const icon = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const NAV = [['home', 'Accueil'], ['suppliers', 'Fournisseurs'], ['entries', 'Entrées'], ['payments', 'Paiements'], ['expenses', 'Dépenses'], ['tariffs', 'Tarifs'], ['receipts', 'Reçus'], ['settings', 'Paramètres']];

/* ---------- État ---------- */
const S = {
  server: { suppliers: [], tariffs: [], entries: [], payments: [], expenses: [], receipts: [] },
  lastPull: null,
  queue: [],           // opérations en attente : {requestId, action, payload, createdAt, tries, failed, error}
  apiUrl: '',
  reachable: null,     // null = inconnu, true/false = dernier échange réseau
  syncing: false,
  lastError: '',
  page: 'home', pid: null
};
const UI = { q: {}, type: 'all', limit: 60 };
let rev = 0, _view = null, _viewRev = -1;

function loadState() {
  const c = lsGet(LS.cache, null);
  if (c && c.server) { S.server = Object.assign(S.server, c.server); S.lastPull = c.lastPull || null; }
  const q = lsGet(LS.queue, []);
  S.queue = Array.isArray(q) ? q : [];
  const saved = lsGet(LS.api, null);
  const savedUrl = (typeof saved === 'string' && saved.trim()) ? saved.trim() : '';
  const oldDeployments = [
    'https://script.google.com/macros/s/AKfycbz5IOIjSV8gccr8VrWVsAr7zGxpL40y66E2vqXOxJqqf8luBe_RFgoKAPlMMxwgZDWftA/exec',
    'https://script.google.com/macros/s/AKfycbytIcbrZicNcOnYxfNXEwfdPURT-c5jjS3OdaFBXynXZOxcc9fOX4Ynf-WhNFrShV6aHg/exec',
    'https://script.google.com/macros/s/AKfycbx5pv8eaXuJDcXhMOuGmiQVIH2gcw_dtnCEF4760hdWkiQhugruxtHLzJyfA1asFW2VxQ/exec'
  ];
  if (!savedUrl || oldDeployments.includes(savedUrl)) {
    S.apiUrl = DEFAULT_API_URL;
    try { localStorage.removeItem(LS.api); } catch (e) { /* ignore */ }
  } else {
    S.apiUrl = savedUrl;
  }
}
const saveCache = () => lsSet(LS.cache, { server: S.server, lastPull: S.lastPull });
const saveQueue = () => lsSet(LS.queue, S.queue);
const bump = () => { rev++; };

/* ---------- Vue calculée : cache serveur + opérations en attente ---------- */
function V() {
  if (_view && _viewRev === rev) return _view;
  const sv = S.server;
  const suppliers = sv.suppliers.slice(), entries = sv.entries.slice(), payments = sv.payments.slice(), expenses = sv.expenses.slice();
  const receipts = sv.receipts.slice();
  const tariffs = Object.assign({}, DEFAULT_TARIFFS);
  let tariffUpdated = '';
  sv.tariffs.forEach(t => { if (t.active !== false && Number(t.value) > 0) tariffs[t.type] = Number(t.value); if ((t.updatedAt || '') > tariffUpdated) tariffUpdated = t.updatedAt; });
  const names = new Set(suppliers.map(s => norm(s.name).trim()));
  const reqE = new Set(entries.map(x => x.requestId)), reqP = new Set(payments.map(x => x.requestId)), reqX = new Set(expenses.map(x => x.requestId));
  let tariffPending = false;
  for (const op of S.queue) {
    if (op.failed) continue;
    const p = op.payload || {};
    if (op.action === 'suppliers.create' && !names.has(norm(p.name).trim())) {
      suppliers.push({ supplierId: p.supplierId, name: p.name, phone: p.phone || '', active: true, createdAt: op.createdAt, updatedAt: op.createdAt, _pending: true });
    } else if (op.action === 'entries.create' && !reqE.has(op.requestId)) {
      entries.push({ entryId: '', requestId: op.requestId, supplierId: p.supplierId, type: p.type, quantity: p.quantity, tariff: p.tariff, amount: round2(p.quantity * p.tariff), date: p.date, createdAt: op.createdAt, updatedAt: op.createdAt, syncStatus: 'pending', _pending: true });
    } else if (op.action === 'payments.create' && !reqP.has(op.requestId)) {
      payments.push({ paymentId: '', requestId: op.requestId, supplierId: p.supplierId, amount: round2(p.amount), method: p.method, receiptId: '', date: p.date, createdAt: op.createdAt, updatedAt: op.createdAt, syncStatus: 'pending', _pending: true });
    } else if (op.action === 'expenses.create' && !reqX.has(op.requestId)) {
      expenses.push({ expenseId: '', requestId: op.requestId, label: p.label, category: p.category, amount: round2(p.amount), method: p.method, date: p.date, createdAt: op.createdAt, updatedAt: op.createdAt, syncStatus: 'pending', _pending: true });
    } else if (op.action === 'tariffs.save') {
      ['kg', 'colis'].forEach(t => { if (Number(p[t]) > 0) tariffs[t] = Number(p[t]); });
      tariffPending = true;
    }
  }
  entries.sort(byDateDesc); payments.sort(byDateDesc); expenses.sort(byDateDesc); receipts.sort(byDateDesc);
  suppliers.sort((a, b) => a.name.localeCompare(b.name, 'fr', { sensitivity: 'base' }));
  const stats = {}, supById = {};
  suppliers.forEach(s => { supById[s.supplierId] = s; stats[s.supplierId] = { kg: 0, colis: 0, billed: 0, paid: 0, balance: 0 }; });
  entries.forEach(e => { const st = stats[e.supplierId]; if (!st) return; if (e.type === 'kg') st.kg += Number(e.quantity); else st.colis += Number(e.quantity); st.billed += Number(e.amount); });
  payments.forEach(p => { const st = stats[p.supplierId]; if (st) st.paid += Number(p.amount); });
  Object.values(stats).forEach(st => { st.kg = round2(st.kg); st.colis = round2(st.colis); st.billed = round2(st.billed); st.paid = round2(st.paid); st.balance = round2(st.billed - st.paid); });
  const billed = round2(sum(entries, e => e.amount)), paid = round2(sum(payments, p => p.amount)), spent = round2(sum(expenses, x => x.amount));
  const totals = {
    kg: round2(sum(entries.filter(e => e.type === 'kg'), e => e.quantity)),
    colis: round2(sum(entries.filter(e => e.type === 'colis'), e => e.quantity)),
    billed, paid, supplierBalance: round2(billed - paid), expenses: spent, companyBalance: round2(paid - spent)
  };
  _view = { suppliers, entries, payments, expenses, receipts, tariffs, tariffUpdated, tariffPending, stats, supById, totals };
  _viewRev = rev;
  return _view;
}
const supName = id => (V().supById[id] || {}).name || id || '—';
const pendingCount = () => S.queue.filter(o => !o.failed).length;
const failedCount = () => S.queue.filter(o => o.failed).length;

/* ---------- Réseau ---------- */
function netErr(msg, network = true) { const e = new Error(msg); e.network = network; return e; }
async function api(action, payload, timeout = 25000) {
  if (!S.apiUrl) throw netErr('Lien de synchronisation non configuré', false);
  const ctl = new AbortController();
  const tm = setTimeout(() => ctl.abort(), timeout);
  let text;
  try {
    const url = new URL(S.apiUrl);
    url.searchParams.set('action', action);
    url.searchParams.set('payload', JSON.stringify(payload || {}));
    url.searchParams.set('_', String(Date.now()));
    const res = await fetch(url.toString(), { method: 'GET', signal: ctl.signal, redirect: 'follow', cache: 'no-store' });
    text = await res.text();
  } catch (e) {
    throw netErr(e && e.name === 'AbortError' ? 'Délai dépassé' : 'Connexion impossible');
  } finally { clearTimeout(tm); }
  let json;
  try { json = JSON.parse(text); } catch (e) { throw netErr('Réponse invalide : vérifiez le lien de synchronisation'); }
  if (!json || json.ok !== true) { const er = new Error((json && json.error) || 'Erreur serveur'); er.server = true; er.retryable = !json || json.retryable !== false; throw er; }
  return json.data;
}

/* ---------- File d'attente & synchronisation ---------- */
function enqueue(action, payload) {
  const op = { requestId: 'REQ-' + uid(), action, payload: Object.assign({}, payload), createdAt: new Date().toISOString(), tries: 0 };
  op.payload.requestId = op.requestId;
  S.queue.push(op);
  saveQueue(); bump(); refreshData(); updateStatus();
  toast(navigator.onLine && S.reachable !== false ? 'Enregistré ✓' : 'Enregistré hors ligne — envoi automatique au retour d\'Internet', 'ok');
  sync();
  return op;
}

function upsert(list, obj, key) { if (!obj) return; const i = list.findIndex(x => x[key] === obj[key]); if (i >= 0) list[i] = obj; else list.push(obj); }
function applyResult(op, r) {
  const sv = S.server;
  if (op.action === 'suppliers.create') upsert(sv.suppliers, r.entity, 'supplierId');
  else if (op.action === 'entries.create') upsert(sv.entries, r.entity, 'entryId');
  else if (op.action === 'payments.create') { upsert(sv.payments, r.entity, 'paymentId'); upsert(sv.receipts, r.receipt, 'receiptId'); }
  else if (op.action === 'expenses.create') upsert(sv.expenses, r.entity, 'expenseId');
  else if (op.action === 'tariffs.save' && Array.isArray(r.tariffs)) sv.tariffs = r.tariffs;
}
function applyIdMap(map) {
  S.queue.forEach(o => { if (o.payload && map[o.payload.supplierId]) o.payload.supplierId = map[o.payload.supplierId]; });
}

let syncedOld = 0;
function pendingBatch() {
  const pending = S.queue.filter(o => !o.failed);
  const picked = [];
  for (const op of pending) {
    const test = picked.concat(op).map(o => ({ requestId: o.requestId, action: o.action, payload: o.payload }));
    const payload = JSON.stringify({ operations: test });
    if (test.length > 8 || encodeURIComponent(payload).length > 6500) break;
    picked.push(op);
  }
  return picked.length ? picked : pending.slice(0, 1);
}
async function pushPending() {
  let total = 0, progressed = true;
  while (progressed) {
    const ops = pendingBatch();
    if (!ops.length) break;
    let data;
    try { data = await api('sync.push', { operations: ops.map(o => ({ requestId: o.requestId, action: o.action, payload: o.payload })) }, 60000); }
    catch (e) { onSyncError(e); return { n: total, err: true }; }
    S.reachable = true; S.lastError = '';
    progressed = false;
    const byId = new Map((data.results || []).map(r => [r.requestId, r]));
    ops.forEach(op => {
      const r = byId.get(op.requestId);
      if (!r) return;
      if (r.ok) {
        S.queue = S.queue.filter(o => o !== op);
        applyResult(op, r);
        progressed = true; total++;
        if (Date.now() - Date.parse(op.createdAt) > 8000) syncedOld++;
        if (op.action === 'payments.create' && r.receipt && !r.duplicate) toast('Reçu ' + r.receipt.receiptId + ' créé — appuyez pour l\'ouvrir', 'ok', () => { location.hash = '#/receipts/' + r.receipt.receiptId; });
      } else if (r.retryable) { op.tries = (op.tries || 0) + 1; op.error = r.error; }
      else { op.failed = true; op.error = r.error; progressed = true; toast('Opération refusée : ' + r.error, 'bad'); }
    });
    if (data.idMap) applyIdMap(data.idMap);
    saveQueue(); saveCache(); bump(); refreshData(); updateStatus();
  }
  return { n: total, err: false };
}

async function pullData() {
  const d = await api('sync.pull', {}, 60000);
  ['suppliers', 'tariffs', 'entries', 'payments', 'expenses', 'receipts'].forEach(k => { if (!Array.isArray(d[k])) throw new Error('Réponse incomplète du serveur (' + k + ')'); });
  S.server = { suppliers: d.suppliers, tariffs: d.tariffs, entries: d.entries, payments: d.payments, expenses: d.expenses, receipts: d.receipts };
  S.lastPull = Date.now(); S.reachable = true; S.lastError = '';
  saveCache(); bump(); refreshData();
}

function onSyncError(e) {
  if (e.network) { S.reachable = e.message.startsWith('Réponse invalide') ? true : false; }
  else S.reachable = true;
  S.lastError = e.message || 'Erreur';
}

let syncP = null, syncAgain = false;
function sync(opts = {}) {
  if (syncP) { syncAgain = true; return syncP; }
  syncP = (async () => {
    try {
      do {
        syncAgain = false;
        if (!S.apiUrl || !navigator.onLine) break;
        S.syncing = true; updateStatus();
        syncedOld = 0;
        const push = await pushPending();
        if (opts.pull !== false && !push.err) { try { await pullData(); } catch (e) { onSyncError(e); } }
        if (push.n && syncedOld) toast('✓ ' + syncedOld + ' opération' + (syncedOld > 1 ? 's' : '') + ' synchronisée' + (syncedOld > 1 ? 's' : ''), 'ok');
      } while (syncAgain);
    } finally { S.syncing = false; syncP = null; updateStatus(); refreshData(); }
  })();
  return syncP;
}

/* ---------- Statut ---------- */
function statusInfo() {
  const pend = pendingCount(), bad = failedCount();
  if (!navigator.onLine || S.reachable === false) return { cls: 'off', text: pend ? 'Hors ligne · ' + pend + ' en attente' : 'Hors ligne' };
  if (S.syncing) return { cls: 'sync', text: 'Synchronisation…' };
  if (bad) return { cls: 'off', text: bad + ' à corriger' };
  if (pend) return { cls: 'wait', text: pend + ' en attente' };
  if (!S.apiUrl) return { cls: 'off', text: 'Lien non configuré' };
  if (S.lastError) return { cls: 'wait', text: 'Erreur serveur' };
  return { cls: 'on', text: 'En ligne' };
}
function updateStatus() {
  const s = statusInfo(), p = $('#pill');
  p.className = 'pill ' + s.cls; p.lastElementChild.textContent = s.text;
  const dot = $('#nav a[data-p="settings"] .dot'), n = pendingCount() + failedCount();
  if (dot) { dot.textContent = n; dot.hidden = !n; }
  const st = $('#set-status'); if (st) st.innerHTML = settingsStatusHtml();
}

/* ---------- Toasts ---------- */
function toast(msg, kind = '', onClick) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind; el.textContent = msg;
  if (onClick) { el.style.cursor = 'pointer'; el.addEventListener('click', () => { onClick(); el.remove(); }); }
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), onClick ? 7000 : 3600);
}

/* ---------- Composants de liste ---------- */
function collection(items, cardFn, cols, opts = {}) {

  return `<div class="cards">${shown.map(cardFn).join('')}</div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr>${cols.map(c => `<th class="${c.cls || ''}">${c.h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
    ${items.length > shown.length ? `<button class="btn ghost more" data-act="more">Afficher plus (${items.length - shown.length})</button>` : ''}`;
}
const pendBadge = () => '<span class="badge wait">En attente</span>';
const searchBox = (page, ph) => `<div class="search">${icon('search')}<input class="in" type="search" id="q" data-search="${page}" placeholder="${esc(ph)}" value="${esc(UI.q[page] || '')}" autocomplete="off" enterkeyhint="search"></div>`;
const balBadge = b => b > 0.004 ? `<span class="badge wait">Reste ${money(b)}</span>` : b < -0.004 ? `<span class="badge info">Avance ${money(-b)}</span>` : '<span class="badge ok">À jour</span>';

/* ---------- Pages ---------- */
const PAGES = {};

PAGES.home = {
  render() {
    const t = V().totals, pend = pendingCount() + failedCount();
    const tile = (l, v, cls = '', href) => `<${href ? 'a href="' + href + '"' : 'div'} class="tile ${cls}"><small>${l}</small><b class="mono">${v}</b></${href ? 'a' : 'div'}>`;
    const cfg = !S.apiUrl ? `<div class="banner"><span><b>Lien de synchronisation manquant.</b> Renseignez-le pour charger et enregistrer vos données.</span><a class="btn gold" href="#/settings">Paramètres</a></div>` : '';
    const empty = S.apiUrl && !S.lastPull && !S.server.suppliers.length ? `<div class="banner"><span>Aucune donnée locale. Les données se chargent dès que la connexion est disponible.</span></div>` : '';
    return `${cfg}${empty}
      <div class="page-h"><div><h1>Accueil</h1><div class="sub">${S.lastPull ? 'Données du ' + fmtDateTime(S.lastPull) : 'Pas encore synchronisé'}</div></div></div>
      <div class="grid">
        ${tile('Poids déposé', qty(t.kg) + ' kg')}
        ${tile('Colis déposés', qty(t.colis))}
        ${tile('Total facturé', money(t.billed))}
        ${tile('Total payé', money(t.paid))}
        ${tile('Solde fournisseurs', money(t.supplierBalance), 'hl')}
        ${tile('Total dépenses', money(t.expenses))}
        ${tile('Solde entreprise', money(t.companyBalance), 'hl ' + (t.companyBalance < 0 ? 'neg' : ''))}
        ${tile('Opérations en attente', pend, pend ? '' : 'pos', '#/settings')}
      </div>
      <h2 class="sec">Actions rapides</h2>
      <div class="quick">
        <button class="btn primary" data-act="add-supplier">${icon('plus')}Fournisseur</button>

async function loadLogoDataUrl() {
  if (LOGO_DATA_URL) return LOGO_DATA_URL;
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth || 512; c.height = img.naturalHeight || 512;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, c.width, c.height);
      LOGO_DATA_URL = c.toDataURL('image/jpeg', 0.92);
      resolve(LOGO_DATA_URL);
    };
    img.onerror = () => resolve('');
    img.src = LOGO_SRC;
  });
}
function downloadBlob(name, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function exportReceiptPdf(r) {
  const pay = V().payments.find(p => p.paymentId === r.paymentId);
  const logo = await loadLogoDataUrl();
  const pageW = 1240, pageH = 1754;
  const c = document.createElement('canvas');
  c.width = pageW; c.height = pageH;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fffdf8'; ctx.fillRect(0, 0, pageW, pageH);
  ctx.fillStyle = '#082b4a'; ctx.fillRect(0, 0, pageW, 22);
  ctx.fillStyle = '#c89538'; ctx.fillRect(0, 22, pageW, 10);
  if (logo) {
    const mark = new Image();
    await new Promise(resolve => { mark.onload = resolve; mark.onerror = resolve; mark.src = logo; });
    ctx.save(); ctx.globalAlpha = 0.08; ctx.drawImage(mark, 240, 410, 760, 760); ctx.restore();
    ctx.drawImage(mark, 470, 92, 300, 300);
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = '#082b4a';
  ctx.font = '700 46px Arial';
  ctx.fillText("POISSONNERIE DE L'EST", pageW / 2, 450);
  ctx.fillStyle = '#c89538';
  ctx.font = '700 30px Arial';
  ctx.fillText('RECU DE PAIEMENT', pageW / 2, 505);
  ctx.fillStyle = '#082b4a';
  ctx.font = '800 64px Arial';
  ctx.fillText(money(r.amount), pageW / 2, 620);
  const rows = [
    ['N° de reçu', r.receiptId],
    ['Date', fmtDate(r.date)],
    ['Fournisseur', r.supplierName + ' (' + r.supplierId + ')'],
    ['Mode de paiement', pay ? pay.method : ''],
    ['Solde avant', money(r.balanceBefore)],
    ['Solde après', money(r.balanceAfter)]
  ].filter(x => x[1]);
  ctx.textAlign = 'left';
  let y = 760;
  rows.forEach(([k, v]) => {
    ctx.fillStyle = '#6c746d'; ctx.font = '28px Arial'; ctx.fillText(k, 170, y);
    ctx.fillStyle = '#11283a'; ctx.font = '700 30px Arial'; ctx.fillText(String(v), 520, y);
    ctx.strokeStyle = '#e4d4b7'; ctx.beginPath(); ctx.moveTo(170, y + 34); ctx.lineTo(1070, y + 34); ctx.stroke();
    y += 86;
  });
  ctx.textAlign = 'center';
  ctx.fillStyle = '#6c746d'; ctx.font = '24px Arial';
  ctx.fillText('Merci pour votre confiance.', pageW / 2, 1420);
  ctx.fillStyle = '#082b4a'; ctx.font = '700 22px Arial';
  ctx.fillText("POISSONNERIE DE L'EST", pageW / 2, 1485);
  const jpg = c.toDataURL('image/jpeg', 0.9);
  const imgBin = atob(jpg.split(',')[1]);
  const content = 'q 595 0 0 842 0 0 cm /Im0 Do Q\n';
  const parts = ['%PDF-1.3\n'];
  const addObj = body => {
    const pos = parts.reduce((n, p) => n + p.length, 0);
    const n = offsets.length + 1;
    offsets.push(pos);
    parts.push(n + ' 0 obj\n' + body + '\nendobj\n');
  };
  const offsets = [];
  addObj('<</Type/Catalog/Pages 2 0 R>>');
  addObj('<</Type/Pages/Count 1/Kids[3 0 R]>>');
  addObj('<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>');
  addObj('<</Type/XObject/Subtype/Image/Width ' + pageW + '/Height ' + pageH + '/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ' + imgBin.length + '>>\nstream\n' + imgBin + '\nendstream');
  addObj('<</Length ' + content.length + '>>\nstream\n' + content + 'endstream');
  const xref = parts.reduce((n, p) => n + p.length, 0);
  parts.push('xref\n0 6\n0000000000 65535 f \n');
  offsets.forEach(o => parts.push(String(o).padStart(10, '0') + ' 00000 n \n'));
  parts.push('trailer<</Size 6/Root 1 0 R>>\nstartxref\n' + xref + '\n%%EOF');
  const bin = parts.join('');
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) & 255;
  downloadBlob(r.receiptId + '.pdf', new Blob([bytes], { type: 'application/pdf' }));
}

}
function queueHtml() {
  if (!S.queue.length) return '<p class="hint" style="margin:0">Aucune opération en attente. Tout est envoyé.</p>';
  return `<div class="opl">${S.queue.map(op => `<div class="op ${op.failed ? 'failed' : ''}"><div class="row" style="display:flex;justify-content:space-between;gap:8px"><b>${esc(OP_LABEL[op.action] || op.action)}</b>${op.failed ? '<span class="badge bad">Refusée</span>' : pendBadge()}</div>
    <div class="hint">${opDetail(op)}</div>${op.error ? `<div class="hint" style="color:var(--bad)">${esc(op.error)}</div>` : ''}
    ${op.failed ? `<div class="acts"><button class="btn" data-act="retry-op" data-id="${esc(op.requestId)}">Réessayer</button><button class="btn danger" data-act="del-op" data-id="${esc(op.requestId)}">Supprimer</button></div>` : ''}</div>`).join('')}</div>`;
}
PAGES.settings = {
  render() {
    return `<div class="page-h"><h1>Paramètres</h1></div>
      <div class="panel"><h3>État</h3><div id="set-status">${settingsStatusHtml()}</div>
        <button class="btn primary block" data-act="manual-sync" style="margin-top:10px">Synchroniser maintenant</button>
        <button class="btn block" data-act="refresh" style="margin-top:8px">Actualiser les données</button></div>
      <div class="panel"><h3>Connexion au système</h3>
        <label class="f"><span class="l">Lien de synchronisation</span><input class="in" id="api-url" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://..." value="${esc(S.apiUrl)}"></label>
        <div class="two"><button class="btn" data-act="test-api">Tester la connexion</button><button class="btn primary" data-act="save-api">Sauvegarder</button></div>
        <button class="btn ghost block" data-act="reset-api" style="margin-top:8px">Remettre le lien par défaut</button>
        <div class="res" id="api-res" role="status"></div></div>
      <div class="panel"><h3>Opérations en attente</h3><div id="set-queue">${queueHtml()}</div></div>
      <p class="hint">Version ${APP_VERSION}. Les opérations en attente partent automatiquement dès que la connexion revient. Le bouton Synchroniser maintenant sert de secours si le téléphone tarde à relancer l'app.</p>`;
  },
  refresh() { const a = $('#set-status'), b = $('#set-queue'); if (a) a.innerHTML = settingsStatusHtml(); if (b) b.innerHTML = queueHtml(); }
};

/* ---------- Routage & rendu ---------- */
const ROUTES = { home: 'home', suppliers: 'suppliers', entries: 'entries', payments: 'payments', expenses: 'expenses', tariffs: 'tariffs', receipts: 'receipts', settings: 'settings' };
function pageKey() {
  if (S.page === 'suppliers' && S.pid) return 'supplier';
  if (S.page === 'receipts' && S.pid) return 'receipt';
  return ROUTES[S.page] || 'home';
}
function route() {
  const h = location.hash.replace(/^#\/?/, '') || 'home';
  const [p, id] = h.split('/');
  S.page = Object.prototype.hasOwnProperty.call(ROUTES, p) ? p : 'home'; S.pid = id ? decodeURIComponent(id) : null;
  UI.limit = 60;
  render();
  try { window.scrollTo(0, 0); } catch (e) { /* jsdom */ }
}
function render() {
  const key = pageKey(), pg = PAGES[key];
  $('#view').innerHTML = pg.render();
  if (pg.mount) pg.mount();
  if (['suppliers', 'entries', 'payments', 'expenses', 'receipts', 'tariffs', 'settings'].includes(key)) pg.refresh();
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.p === S.page));
  const on = $('#nav a.on'), nav = $('#nav');
  if (on && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = on.offsetLeft - (nav.clientWidth - on.clientWidth) / 2;
  updateStatus();
}
function refreshData() {
  const pg = PAGES[pageKey()];
  if (pg && pg.refresh) pg.refresh();
}

/* ---------- Formulaires (feuille) ---------- */
function openSheet({ title, html, submitLabel, onSubmit, onOpen }) {
  closeSheet();
  const root = $('#sheet-root');
  root.innerHTML = `<div class="ov" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-h"><h2>${esc(title)}</h2><button class="x" type="button" data-close aria-label="Fermer">✕</button></div>
    <form id="sheet-form" novalidate>${html}<div class="err" id="sheet-err" role="alert"></div>
    <div class="sheet-f"><button type="button" class="btn ghost" data-close>Annuler</button><button type="submit" class="btn primary">${esc(submitLabel)}</button></div></form></div>`;
  document.body.classList.add('noscroll');
  const form = $('#sheet-form');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = form.querySelector('[type=submit]'); btn.disabled = true;
    const err = await onSubmit(form);
    if (err) { $('#sheet-err').textContent = err; btn.disabled = false; } else closeSheet();
  });
  if (onOpen) onOpen(form);
}
function closeSheet() { $('#sheet-root').innerHTML = ''; document.body.classList.remove('noscroll'); }

const supplierOptions = sel => '<option value="">Choisir un fournisseur…</option>' + V().suppliers.filter(s => s.active !== false).map(s => `<option value="${esc(s.supplierId)}" ${s.supplierId === sel ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
const methodOptions = () => METHODS.map(m => `<option>${esc(m)}</option>`).join('');

function formSupplier() {
  openSheet({
    title: 'Nouveau fournisseur', submitLabel: 'Enregistrer',
    html: `<label class="f"><span class="l">Nom du fournisseur</span><input class="in" name="name" autocomplete="off" autocapitalize="characters" maxlength="60"></label>
           <label class="f"><span class="l">Téléphone (facultatif)</span><input class="in" name="phone" type="tel" inputmode="tel" autocomplete="off" maxlength="30"></label>
           <p class="hint">Le nom sert aussi d'identifiant sur le portail fournisseur.</p>`,
    onOpen: f => setTimeout(() => f.elements.name.focus(), 60),
    onSubmit: f => {
      const E = f.elements, name = E.name.value.replace(/\s+/g, ' ').trim();
      if (!name) return 'Le nom est obligatoire.';
      if (V().suppliers.some(s => norm(s.name).trim() === norm(name).trim())) return 'Ce nom existe déjà.';
      enqueue('suppliers.create', { supplierId: nextSupplierId(), name, phone: E.phone.value.trim() });
    }
  });
}
function nextSupplierId() {
  let max = 0;
  V().suppliers.forEach(s => { const m = /^F-(\d+)$/.exec(s.supplierId); if (m) max = Math.max(max, +m[1]); });
  return 'F-' + String(max + 1).padStart(3, '0');
}

function formEntry(supId) {
  openSheet({
    title: 'Nouvelle entrée', submitLabel: 'Enregistrer',
    html: `<label class="f"><span class="l">Fournisseur</span><select class="in" name="sup">${supplierOptions(supId)}</select></label>
      <div class="seg"><label><input type="radio" name="type" value="kg" checked><span>Kilos (kg)</span></label><label><input type="radio" name="type" value="colis"><span>Colis</span></label></div>
      <div class="two"><label class="f"><span class="l">Quantité</span><input class="in" name="qty" inputmode="decimal" autocomplete="off" placeholder="0"></label>
      <label class="f"><span class="l">Date</span><input class="in" name="date" type="date" value="${todayStr()}"></label></div>
      <label class="f"><span class="l">Tarif appliqué ($)</span><input class="in" name="tariff" readonly></label>
      <div class="calc"><span>Montant</span><b class="mono" id="calc">0,00 $</b></div>`,
    onOpen: f => {
      const E = f.elements;
      const upd = () => {
        const type = E.type.value, t = V().tariffs[type], q = parseNum(E.qty.value);
        E.tariff.value = tariffTxt(t) + ' $ / ' + type;
        $('#calc').textContent = money(isNaN(q) || q < 0 ? 0 : q * t);
      };
      f.addEventListener('input', upd); f.addEventListener('change', upd); upd();
    },
    onSubmit: f => {
      const E = f.elements, type = E.type.value, q = parseNum(E.qty.value), date = E.date.value;
      if (!E.sup.value) return 'Choisissez un fournisseur.';
      if (!(q > 0)) return 'Saisissez une quantité supérieure à 0.';
      if (type === 'colis' && !Number.isInteger(q)) return 'Le nombre de colis doit être un entier.';
      if (!isDate(date)) return 'Date invalide.';
      enqueue('entries.create', { supplierId: E.sup.value, type, quantity: q, tariff: V().tariffs[type], date });
    }
  });
}

function formPayment(supId) {
  openSheet({
    title: 'Nouveau paiement', submitLabel: 'Enregistrer',
    html: `<label class="f"><span class="l">Fournisseur</span><select class="in" name="sup">${supplierOptions(supId)}</select></label>
      <div class="calc"><span>Reste à payer</span><b class="mono" id="bal">—</b></div>
      <div class="two"><label class="f"><span class="l">Montant ($)</span><input class="in" name="amount" inputmode="decimal" autocomplete="off" placeholder="0,00"></label>
      <label class="f"><span class="l">Date</span><input class="in" name="date" type="date" value="${todayStr()}"></label></div>
      <label class="f"><span class="l">Méthode</span><select class="in" name="method">${methodOptions()}</select></label>
      <p class="hint">Un reçu est créé automatiquement.</p>`,
    onOpen: f => {
      const upd = () => { const st = V().stats[f.elements.sup.value]; $('#bal').textContent = st ? money(st.balance) : '—'; };
      f.elements.sup.addEventListener('change', upd); upd();
    },
    onSubmit: f => {
      const E = f.elements, a = parseNum(E.amount.value), date = E.date.value, st = V().stats[E.sup.value];
      if (!E.sup.value) return 'Choisissez un fournisseur.';
      if (!(a > 0)) return 'Saisissez un montant supérieur à 0.';
      if (!isDate(date)) return 'Date invalide.';
      if (st && a > st.balance + 0.005 && !confirm('Ce montant (' + money(a) + ') dépasse le reste à payer (' + money(st.balance) + '). Enregistrer quand même ?')) return 'Paiement non enregistré.';
      enqueue('payments.create', { supplierId: E.sup.value, amount: round2(a), method: E.method.value, date });
    }
  });
}

function formExpense() {
  openSheet({
    title: 'Nouvelle dépense', submitLabel: 'Enregistrer',
    html: `<label class="f"><span class="l">Libellé</span><input class="in" name="label" autocomplete="off" maxlength="80"></label>
      <label class="f"><span class="l">Catégorie</span><input class="in" name="category" list="cats" autocomplete="off" maxlength="40" placeholder="Transport, Salaire…"><datalist id="cats">${CATEGORIES.map(c => `<option value="${esc(c)}">`).join('')}</datalist></label>
      <div class="two"><label class="f"><span class="l">Montant ($)</span><input class="in" name="amount" inputmode="decimal" autocomplete="off" placeholder="0,00"></label>
      <label class="f"><span class="l">Date</span><input class="in" name="date" type="date" value="${todayStr()}"></label></div>
      <label class="f"><span class="l">Méthode</span><select class="in" name="method">${methodOptions()}</select></label>`,
    onOpen: f => setTimeout(() => f.elements.label.focus(), 60),
    onSubmit: f => {
      const E = f.elements, label = E.label.value.replace(/\s+/g, ' ').trim(), a = parseNum(E.amount.value), date = E.date.value;
      if (!label) return 'Le libellé est obligatoire.';
      if (!(a > 0)) return 'Saisissez un montant supérieur à 0.';
      if (!isDate(date)) return 'Date invalide.';
      enqueue('expenses.create', { label, category: E.category.value.trim() || 'Autre', amount: round2(a), method: E.method.value, date });
    }
  });
}

/* ---------- Actions (délégation d'événements) ---------- */
function download(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const findReceipt = id => V().receipts.find(r => r.receiptId === id);
function normalizeUrl(u) { return String(u || '').trim(); }
function validUrl(u) { try { const x = new URL(u); return x.protocol === 'https:' || x.protocol === 'http:'; } catch (e) { return false; } }

const ACTIONS = {
  'add-supplier': () => formSupplier(),
  'add-entry': el => formEntry(el.dataset.sup),
  'add-payment': el => formPayment(el.dataset.sup),
  'add-expense': () => formExpense(),
  more() { UI.limit += 60; refreshData(); },
  print() { window.print(); },
  async 'export-pdf'(el) { const r = findReceipt(el.dataset.id); if (r) { toast('Préparation du PDF…'); await exportReceiptPdf(r); toast('PDF téléchargé', 'ok'); } },
  'export-txt'(el) { const r = findReceipt(el.dataset.id); if (r) download(r.receiptId + '.txt', receiptText(r)); },
  async share(el) { const r = findReceipt(el.dataset.id); if (!r) return; try { await navigator.share({ title: 'Reçu ' + r.receiptId, text: receiptText(r) }); } catch (e) { /* annulé */ } },
  'save-tariffs'() {
    const kg = parseNum($('#t-kg').value), colis = parseNum($('#t-colis').value), err = $('#t-err');
    if (!(kg > 0) || !(colis > 0)) { err.textContent = 'Saisissez deux tarifs supérieurs à 0.'; return; }
    const cur = V().tariffs;
    if (kg === cur.kg && colis === cur.colis) { err.textContent = 'Aucun changement.'; return; }
    err.textContent = '';
    enqueue('tariffs.save', { kg, colis });
  },
  async 'test-api'() {
    const url = normalizeUrl($('#api-url').value), res = $('#api-res');
    if (!validUrl(url)) { res.className = 'res bad'; res.textContent = 'Lien invalide (il doit commencer par https://).'; return; }
    res.className = 'res'; res.textContent = 'Test en cours…';
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 20000), t0 = Date.now();
    try {
      const r = await fetch(url, { method: 'GET', signal: ctl.signal, redirect: 'follow' });
      const j = JSON.parse(await r.text());
      if (j && j.ok) { res.className = 'res ok'; res.textContent = '✓ Connexion réussie (' + (j.message || 'API active') + ') — ' + (Date.now() - t0) + ' ms'; }
      else throw new Error('Réponse inattendue');
    } catch (e) {
      res.className = 'res bad';
      res.textContent = navigator.onLine ? '✗ Échec : le lien ne répond pas correctement. Vérifiez le lien de synchronisation.' : '✗ Vous êtes hors ligne.';
    } finally { clearTimeout(tm); }
  },
  'save-api'() {
    const url = normalizeUrl($('#api-url').value), res = $('#api-res');
    if (url && !validUrl(url)) { res.className = 'res bad'; res.textContent = 'Lien invalide (il doit commencer par https://).'; return; }
    S.apiUrl = url || DEFAULT_API_URL; lsSet(LS.api, url || '');
    res.className = 'res ok'; res.textContent = url ? '✓ Lien enregistré.' : '✓ Lien par défaut rétabli.';
    S.reachable = null; S.lastError = ''; updateStatus(); sync();
  },
  'reset-api'() {
    const res = $('#api-res');
    try { localStorage.removeItem(LS.api); } catch (e) { /* ignore */ }
    S.apiUrl = DEFAULT_API_URL; $('#api-url').value = DEFAULT_API_URL; S.reachable = null; S.lastError = '';
    res.className = 'res ' + (DEFAULT_API_URL ? 'ok' : ''); res.textContent = DEFAULT_API_URL ? '✓ Lien par défaut rétabli.' : 'Aucun lien par défaut défini dans l\'application : le champ est vide.';
    updateStatus();
  },
  async 'manual-sync'() {
    if (!S.apiUrl) { toast('Lien de synchronisation manquant', 'bad'); location.hash = '#/settings'; return; }
    if (!navigator.onLine) { updateStatus(); toast('Téléphone hors ligne : opération gardée en attente', 'bad'); refreshData(); return; }
    S.lastError = ''; S.reachable = null; updateStatus();
    toast('Synchronisation en cours…');
    await sync({ pull: true });
    if (!S.lastError && S.reachable !== false && !failedCount()) toast(pendingCount() ? 'Certaines opérations restent en attente' : 'Synchronisation terminée', pendingCount() ? 'wait' : 'ok');
    else toast('Synchronisation impossible : ' + (S.lastError || 'connexion instable'), 'bad');
  },
  async refresh() { toast('Actualisation…'); await sync(); if (!S.lastError && S.reachable !== false) toast('Données à jour', 'ok'); else toast('Impossible d\'actualiser : ' + (S.lastError || 'hors ligne'), 'bad'); },
  'retry-op'(el) { const op = S.queue.find(o => o.requestId === el.dataset.id); if (op) { op.failed = false; op.error = ''; saveQueue(); bump(); refreshData(); updateStatus(); sync(); } },
  'del-op'(el) { if (!confirm('Supprimer définitivement cette opération refusée ?')) return; S.queue = S.queue.filter(o => o.requestId !== el.dataset.id); saveQueue(); bump(); refreshData(); updateStatus(); }
};

function bindEvents() {
  document.addEventListener('click', e => {
    const close = e.target.closest('[data-close]'); if (close) { closeSheet(); return; }
    const t = e.target.closest('[data-type]'); if (t && S.page === 'entries') { UI.type = t.dataset.type; UI.limit = 60; refreshData(); return; }
    const act = e.target.closest('[data-act]'); if (act && ACTIONS[act.dataset.act]) { e.preventDefault(); ACTIONS[act.dataset.act](act); return; }
    const row = e.target.closest('tr[data-href]'); if (row && !e.target.closest('a')) location.hash = row.dataset.href;
  });
  let tm;
  document.addEventListener('input', e => {
    const el = e.target.closest('[data-search]'); if (!el) return;
    clearTimeout(tm); tm = setTimeout(() => { UI.q[el.dataset.search] = el.value; UI.limit = 60; refreshData(); }, 120);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  $('#pill').addEventListener('click', () => { location.hash = '#/settings'; });
  window.addEventListener('hashchange', route);
  window.addEventListener('online', () => { S.reachable = null; updateStatus(); sync(); });
  window.addEventListener('offline', () => { updateStatus(); refreshData(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
  setInterval(() => { if (navigator.onLine) sync({ pull: document.visibilityState === 'visible' }); else updateStatus(); }, 30000);
}

/* ---------- Démarrage ---------- */
function init() {
  loadState();
  $('#nav').innerHTML = NAV.map(([k, l]) => `<a href="#/${k}" data-p="${k}">${icon(k)}<span>${l}</span>${k === 'settings' ? '<span class="dot" hidden></span>' : ''}</a>`).join('');
  const img = new Image(); img.className = 'logo'; img.alt = '';
  img.onload = () => { const m = $('#mark'); if (m) m.replaceWith(img); };
  img.src = 'logo.png';
  bindEvents();
  route();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  sync();
}
init();
</script>
